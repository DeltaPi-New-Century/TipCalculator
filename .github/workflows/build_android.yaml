name: Build

on:
  push:
    tags:
      # 2.10.1            -> release  -> production track
      # 2.10.1-beta.1     -> beta     -> beta track
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-beta*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, e.g. 2.10.1 or 2.10.1-beta.1'
        required: true
        type: string

concurrency:
  group: build-android-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  # Highest versionCode already uploaded to Play, so generated codes never
  # collide with builds made before this workflow owned the numbering.
  BUILD_NUMBER_OFFSET: 100

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        env:
          RAW_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          TAG="$RAW_TAG"
          if ! echo "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-beta.*)?$'; then
            echo "::error::Tag '$TAG' does not match MAJOR.MINOR.PATCH[-beta*]"
            exit 1
          fi
          if echo "$TAG" | grep -q -- '-beta'; then
            CHANNEL=beta
            TRACK=beta
          else
            CHANNEL=release
            TRACK=production
          fi

          # The tag is the source of truth for the version name. TipCalculatorIaC
          # must consume these as `flutter build --build-name/--build-number`,
          # which override pubspec.yaml.
          VERSION="$(echo "$TAG" | sed -E 's/-beta.*$//')"

          # versionCode must strictly increase on every Play upload, and a tag
          # gives no such guarantee (2.1.1 can follow 2.10.1). run_number does.
          # BUILD_NUMBER_OFFSET keeps it above the highest code already uploaded.
          BUILD_NUMBER=$(( BUILD_NUMBER_OFFSET + GITHUB_RUN_NUMBER ))

          echo "tag=$TAG"                   >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"           >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL"           >> "$GITHUB_OUTPUT"
          echo "track=$TRACK"               >> "$GITHUB_OUTPUT"
          echo "### $CHANNEL build \`$VERSION+$BUILD_NUMBER\` from tag \`$TAG\` (track: $TRACK)" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Note pubspec version drift
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          # Informational only: the tag wins, pubspec.yaml is just the local dev
          # default. A mismatch is worth seeing but must not block a release.
          PUBSPEC_VERSION="$(grep -m1 '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//; s/\+.*$//')"
          if [ "$PUBSPEC_VERSION" != "$VERSION" ]; then
            echo "::warning::pubspec.yaml says '$PUBSPEC_VERSION'; building '$VERSION' from the tag."
          fi

      - name: Build Signal
        env:
          GH_TOKEN: ${{ secrets.TIPCALCULATOR_PAT }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
          BUILD_NUMBER: ${{ steps.tag.outputs.build_number }}
          CHANNEL: ${{ steps.tag.outputs.channel }}
          TRACK: ${{ steps.tag.outputs.track }}
        run: |
          PAYLOAD="$(jq -n \
            --arg sha          "$(git rev-parse HEAD)" \
            --arg ref          "refs/tags/$TAG" \
            --arg tag          "$TAG" \
            --arg version      "$VERSION" \
            --arg build_number "$BUILD_NUMBER" \
            --arg channel      "$CHANNEL" \
            --arg track        "$TRACK" \
            '{event_type: "build-tipcalculator", client_payload: {sha: $sha, ref: $ref, tag: $tag, version: $version, build_number: $build_number, channel: $channel, track: $track}}')"

          # --location: a renamed repository answers 301 here, and curl neither
          # follows nor fails on that, so the dispatch would silently vanish.
          curl --fail-with-body --location -sS -X POST \
            https://api.github.com/repos/DeltaPi-New-Century/TipCalculatorIaC/dispatches \
            -H 'Accept: application/vnd.github.v3+json' \
            -H "Authorization: token $GH_TOKEN" \
            --data "$PAYLOAD"
